# Builds firmware images for the STBE Stellar F4 boards (both revisions) with
# the AK9916 (AK09916) magnetometer enabled, and commits the resulting .hex
# files back into this branch.
#
# A baseline image (magnetometer disabled) is built as well, so the two can be
# compared on hardware and the build report can show that the magnetometer
# subsystem is really linked in.
#
# This exists because the machine that authored the driver has no usable ARM
# toolchain; the GitHub runner has the required network access.

name: Build firmware (AK9916)

on:
  push:
    branches:
      - firmware/ak9916-stellarf4v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.config }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # both jobs commit into this branch, so serialise them
      max-parallel: 1
      matrix:
        config: [STELLARF4V2, STELLARF4]
    env:
      CONFIG_NAME: ${{ matrix.config }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Init config submodule
        run: git submodule update --init -- src/config

      - name: Install ARM toolchain
        run: make SDK=arm platform-tools-install

      - name: Build baseline (magnetometer disabled)
        run: make EXTRA_FLAGS=-Werror ${CONFIG_NAME}

      - name: Stash baseline image
        run: |
          mkdir -p firmware
          cp -v obj/*.hex "firmware/baseline_${CONFIG_NAME}.hex"

      - name: Board config patch (magnetometer + UART1 on V2)
        run: |
          header="src/config/configs/STBE/${CONFIG_NAME}/config.h"
          printf '\n#ifndef USE_MAG\n#define USE_MAG\n#endif\n#ifndef USE_MAG_AK9916\n#define USE_MAG_AK9916\n#endif\n' >> "$header"
          if [ "${CONFIG_NAME}" = "STELLARF4V2" ]; then
            # PA9/PA10 are declared as SERVO5/SERVO6 in the V2 config, but the
            # pads are USART1 TX/RX. UART1 is compiled in for STM32F405 but its
            # pins default to NONE, which makes the port unusable. Expose them as
            # UART1 and drop the servo defaults.
            sed -i 's|^#define SERVO5_PIN.*|// PA9  - used as UART1_TX_PIN|' "$header"
            sed -i 's|^#define SERVO6_PIN.*|// PA10 - used as UART1_RX_PIN|' "$header"
            printf '\n#define UART1_TX_PIN PA9\n#define UART1_RX_PIN PA10\n' >> "$header"
          fi
          grep -nE 'USE_MAG|UART1_(TX|RX)_PIN|SERVO[56]_PIN' "$header" || true
          tail -8 "$header"

      - name: Build with magnetometer
        run: make EXTRA_FLAGS=-Werror ${CONFIG_NAME}

      - name: Verify the AK9916 driver is in the build
        run: |
          set +e
          OBJDIR=$(ls -d obj/main/*${CONFIG_NAME})
          {
            echo "### ${CONFIG_NAME}"
            echo
            echo "=== config header tail ==="
            tail -6 "src/config/configs/STBE/${CONFIG_NAME}/config.h"
            echo
            echo "=== compass driver objects (empty bodies unless USE_MAG_AK9916 / USE_MAG) ==="
            ls -l "$OBJDIR/drivers/compass/compass_ak9916.o" \
                  "$OBJDIR/drivers/compass/compass_ak8963.o" \
                  "$OBJDIR/drivers/compass/compass_bmm350.o" \
                  "$OBJDIR/sensors/compass.o" 2>&1
            echo
            echo "=== image sizes: magnetometer enabled vs baseline ==="
            ls -l obj/*.hex "firmware/baseline_${CONFIG_NAME}.hex"
            echo
            echo "=== hashes ==="
            sha256sum obj/*.hex "firmware/baseline_${CONFIG_NAME}.hex"
          } | tee "firmware/build-report-${CONFIG_NAME}.txt"
          exit 0

      - name: Publish firmware to this branch
        run: |
          cp -v obj/*.hex firmware/ 2>/dev/null || true
          ls -l firmware
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add -f firmware
          git commit -m "firmware: ${CONFIG_NAME} with AK9916 compass driver [skip ci]" || echo "nothing to commit"
          git push
