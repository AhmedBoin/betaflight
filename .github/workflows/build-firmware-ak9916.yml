# Builds a firmware image for a single unified target with the AK9916
# (AK09916) magnetometer enabled, and commits the resulting .hex back into this
# branch. Also builds a baseline image (magnetometer disabled) so the two can be
# compared on hardware, and records symbol/size evidence that the new driver is
# really linked in.
#
# This exists because the machine that authored the driver has no usable
# ARM toolchain; the GitHub runner has the required network access.

name: Build firmware (AK9916)

on:
  push:
    branches:
      - firmware/ak9916-stellarf4v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build STELLARF4V2 firmware
    runs-on: ubuntu-latest
    env:
      CONFIG_NAME: STELLARF4V2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Init config submodule
        run: git submodule update --init -- src/config

      - name: Install ARM toolchain
        run: make SDK=arm platform-tools-install

      - name: Build baseline (magnetometer disabled)
        run: make EXTRA_FLAGS=-Werror ${CONFIG_NAME}

      - name: Stash baseline image
        run: |
          mkdir -p firmware
          cp -v obj/*.hex "firmware/baseline_${CONFIG_NAME}.hex"

      - name: Enable the magnetometer on ${{ env.CONFIG_NAME }}
        run: |
          header="src/config/configs/STBE/${CONFIG_NAME}/config.h"
          printf '\n#ifndef USE_MAG\n#define USE_MAG\n#endif\n#ifndef USE_MAG_AK9916\n#define USE_MAG_AK9916\n#endif\n' >> "$header"
          tail -6 "$header"

      - name: Build with magnetometer
        run: make EXTRA_FLAGS=-Werror ${CONFIG_NAME}

      - name: Verify the AK9916 driver is in the build
        run: |
          set +e
          OBJDIR=$(ls -d obj/main/*${CONFIG_NAME})
          NM=$(ls tools/gcc-arm-none-eabi-*/bin/arm-none-eabi-nm | head -1)
          {
            echo "=== compiler ==="
            "$(dirname "$NM")/arm-none-eabi-gcc" --version | head -1
            echo
            echo "=== config header tail ==="
            tail -6 src/config/configs/STBE/${CONFIG_NAME}/config.h
            echo
            echo "=== driver object symbols (body empty unless USE_MAG_AK9916) ==="
            $NM "$OBJDIR/drivers/compass/compass_ak9916.o" | grep -i ak9916
            echo
            echo "=== sensors/compass.o symbols (compassInit etc. only exist with USE_MAG) ==="
            $NM "$OBJDIR/sensors/compass.o" | grep -E "compassInit|compassUpdate|ak9916"
            echo
            echo "=== object sizes ==="
            ls -l "$OBJDIR/drivers/compass/compass_ak9916.o" "$OBJDIR/sensors/compass.o" "$OBJDIR/drivers/compass/compass_bmm350.o" "$OBJDIR/drivers/compass/compass_ak8963.o"
            echo
            echo "=== image sizes: magnetometer enabled vs baseline ==="
            ls -l obj/*.hex "firmware/baseline_${CONFIG_NAME}.hex"
            echo
            echo "=== hashes ==="
            sha256sum obj/*.hex "firmware/baseline_${CONFIG_NAME}.hex"
          } | tee firmware/build-report.txt
          exit 0

      - name: Publish firmware to this branch
        run: |
          cp -v obj/*.hex firmware/ 2>/dev/null || true
          ls -l firmware
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f firmware
          git commit -m "firmware: ${CONFIG_NAME} with AK9916 compass driver [skip ci]" || echo "nothing to commit"
          git push
